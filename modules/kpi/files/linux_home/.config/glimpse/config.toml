#:schema /usr/share/glimpse/config.schema.json

[calendar]
# Secret iCal feed: the URL is NOT stored here. `calendars/` is a symlink to
# ~/.keys/glimpse/calendars (deployed by kpi::home::glimpse), and personal.url
# holds the raw provider URL outside the repo. See docs/calendar.md (sidecars).
[[calendar.sources]]
id = "personal"
type = "ical"
name = "Personal"
uri = "file:///home/kpi/.config/glimpse/calendars/personal.url"
color = "#4285f4"

[notifications]
hide-delay = 7
max-items = 2
monitor = "HDMI-A-1"

[idle]
profiles.ac.listeners = [
  { timeout = 300, on-idle = "loginctl lock-session" },
  { timeout = 600, on-idle = "niri msg action power-off-monitors" },
]
profiles.battery.listeners = [
  { timeout = 300, on-idle = "loginctl lock-session" },
  { timeout = 600, on-idle = "niri msg action power-off-monitors" },
]
