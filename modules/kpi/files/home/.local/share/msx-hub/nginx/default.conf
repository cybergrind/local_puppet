server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    # Proxy XSMART's MSX menu so it gets the CORS headers injected by traefik.
    # Maps http://tv.lan/msx/xsmart/<path> -> http://app.xsmart.tv/msx/<path>
    location /msx/xsmart/ {
        proxy_pass http://app.xsmart.tv/msx/;
        proxy_set_header Host app.xsmart.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
