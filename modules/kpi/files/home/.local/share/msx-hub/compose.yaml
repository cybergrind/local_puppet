---
# MSX TV hub: serves Media Station X start/hub JSON for the LG TV.
# Routed by the host traefik via labels; reachable as http://tv.lan
# (MikroTik static DNS tv.lan -> this machine).
# NOTE: the container is deployed on host `lzz` (access via `ssh lzz`); run this
# compose there, e.g. `ssh lzz msx-hub` or `ssh lzz docker compose ...`.
# External content endpoints must also enable CORS — MSX players load content via XHR.
services:
  msx-hub:
    image: nginx:alpine
    container_name: msx-hub
    restart: unless-stopped
    volumes:
      - ./msx:/usr/share/nginx/html/msx:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.msx.rule: Host(`tv.lan`)
      traefik.http.routers.msx.entrypoints: web
      traefik.http.routers.msx.middlewares: msx-cors
      traefik.http.services.msx.loadbalancer.server.port: "80"
      # MSX (msx.benzac.de) loads these files cross-origin; CORS is mandatory
      traefik.http.middlewares.msx-cors.headers.accesscontrolalloworiginlist: "*"
      traefik.http.middlewares.msx-cors.headers.accesscontrolallowmethods: GET,OPTIONS
